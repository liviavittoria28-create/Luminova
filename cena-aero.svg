<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d6fd6"/><stop offset=".35" stop-color="#3aa6f2"/><stop offset=".62" stop-color="#9fdcff"/><stop offset=".66" stop-color="#d9f3ff"/>
    </linearGradient>
    <radialGradient id="sol" cx=".82" cy=".1" r=".45"><stop offset="0" stop-color="#fff"/><stop offset=".12" stop-color="#fff" stop-opacity=".9"/><stop offset=".4" stop-color="#e8f8ff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="mar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fd2f5"/><stop offset=".25" stop-color="#16aee3"/><stop offset=".7" stop-color="#0a7fcf"/><stop offset="1" stop-color="#0b5fb0"/></linearGradient>
    <linearGradient id="vidro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9fbff" stop-opacity=".95"/><stop offset=".5" stop-color="#7fd0f5" stop-opacity=".7"/><stop offset="1" stop-color="#2a8fd6" stop-opacity=".8"/></linearGradient>
    <linearGradient id="grama" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9f25a"/><stop offset=".45" stop-color="#5fc52c"/><stop offset="1" stop-color="#2c8a1c"/></linearGradient>
    <linearGradient id="grama2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ae84a"/><stop offset="1" stop-color="#3a9c22"/></linearGradient>
    <linearGradient id="rocha" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe6f6"/><stop offset="1" stop-color="#6f93b8"/></linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="nuvem" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="suave"><feGaussianBlur stdDeviation="2.2"/></filter>
    <g id="flor"><circle r="5" fill="#ffb3d6"/><circle cx="6" cy="-3" r="4.5" fill="#ffd1e6"/><circle cx="-5" cy="-4" r="4" fill="#ff9fcb"/><circle cx="1" cy="-7" r="4" fill="#fff0f7"/><circle cx="1" cy="-3" r="2" fill="#fff6a8"/></g>
  </defs>

  <!-- céu e sol -->
  <rect width="1600" height="1000" fill="url(#ceu)"/>
  <rect width="1600" height="1000" fill="url(#sol)"/>
  <g stroke="#fff" stroke-opacity=".22" stroke-width="2">
    <path d="M1310 100 L900 640"/><path d="M1310 100 L1180 640"/><path d="M1310 100 L1500 640"/><path d="M1310 100 L700 520"/>
  </g>

  <!-- nuvens -->
  <g fill="#fff" filter="url(#nuvem)">
    <ellipse cx="220" cy="150" rx="170" ry="42" opacity=".95"/><ellipse cx="320" cy="128" rx="110" ry="44"/><ellipse cx="140" cy="132" rx="90" ry="34"/>
    <ellipse cx="760" cy="230" rx="210" ry="38" opacity=".75"/><ellipse cx="860" cy="210" rx="120" ry="36" opacity=".8"/>
    <ellipse cx="1420" cy="300" rx="190" ry="40" opacity=".8"/><ellipse cx="1520" cy="280" rx="110" ry="36"/>
    <ellipse cx="520" cy="420" rx="260" ry="34" opacity=".55"/><ellipse cx="1150" cy="455" rx="240" ry="30" opacity=".5"/>
  </g>

  <!-- ilhas flutuantes -->
  <g>
    <path d="M520 90 q60-30 130 0 q-10 40-65 70 q-55-30-65-70z" fill="url(#rocha)"/>
    <path d="M520 90 q60-26 130 0 q-60-14-130 0z" fill="url(#grama2)"/>
    <path d="M1040 150 q40-18 86 0 q-8 28-43 46 q-35-18-43-46z" fill="url(#rocha)" opacity=".9"/>
    <path d="M1040 150 q40-15 86 0 q-40-10-86 0z" fill="url(#grama2)"/>
  </g>

  <!-- anéis holográficos -->
  <g fill="none" filter="url(#glow)">
    <circle cx="90" cy="260" r="230" stroke="#3ff3ff" stroke-width="5" stroke-opacity=".75" stroke-dasharray="380 60 120 40"/>
    <circle cx="90" cy="260" r="190" stroke="#9ffcff" stroke-width="2" stroke-opacity=".7"/>
    <circle cx="90" cy="260" r="150" stroke="#3ff3ff" stroke-width="8" stroke-opacity=".35" stroke-dasharray="70 30"/>
    <circle cx="1520" cy="200" r="200" stroke="#3ff3ff" stroke-width="5" stroke-opacity=".7" stroke-dasharray="300 50 90 30"/>
    <circle cx="1520" cy="200" r="160" stroke="#c6ffff" stroke-width="2" stroke-opacity=".7"/>
    <path d="M-40 330 C 400 120, 900 260, 1650 40" stroke="#ff7ad9" stroke-width="3" stroke-opacity=".8"/>
    <path d="M-40 360 C 380 170, 920 300, 1650 90" stroke="#3ff3ff" stroke-width="2.5" stroke-opacity=".9"/>
    <path d="M200 -20 C 420 160, 700 120, 980 -30" stroke="#ffb0ec" stroke-width="2" stroke-opacity=".7"/>
  </g>

  <!-- cidade de vidro no horizonte -->
  <g opacity=".92">
    <rect x="1120" y="470" width="44" height="170" fill="url(#vidro)"/><rect x="1172" y="420" width="58" height="220" fill="url(#vidro)"/>
    <rect x="1240" y="500" width="40" height="140" fill="url(#vidro)"/><rect x="1288" y="450" width="34" height="190" fill="url(#vidro)"/>
    <rect x="1330" y="520" width="56" height="120" fill="url(#vidro)"/><rect x="1060" y="530" width="50" height="110" fill="url(#vidro)"/>
    <g fill="#fff" opacity=".55"><rect x="1176" y="430" width="6" height="200"/><rect x="1124" y="480" width="4" height="150"/><rect x="1292" y="460" width="4" height="170"/></g>
    <path d="M1201 420 v-40" stroke="#dff7ff" stroke-width="3"/>
  </g>
  <!-- torre eólica -->
  <g stroke="#f4fbff" stroke-width="4" stroke-linecap="square" opacity=".95">
    <path d="M300 640 V470"/><path d="M300 470 l-6 -70 M300 470 l62 30 M300 470 l-56 40" stroke-width="5"/>
  </g>

  <!-- mar -->
  <rect y="640" width="1600" height="360" fill="url(#mar)"/>
  <rect y="640" width="1600" height="6" fill="#e8fbff" opacity=".85"/>
  <g stroke="#fff" stroke-linecap="square" opacity=".55">
    <path d="M1160 660 h300 M1200 680 h220 M1240 700 h150 M1270 720 h90" stroke-width="3"/>
    <path d="M80 690 h120 M420 712 h160 M720 670 h140 M900 735 h120 M560 760 h200 M200 790 h140" stroke-width="2"/>
  </g>
  <g fill="none" stroke="#bff6ff" stroke-width="2" opacity=".45">
    <path d="M0 820 q100 -18 200 0 t200 0 t200 0 t200 0 t200 0 t200 0 t200 0 t200 0"/>
    <path d="M0 860 q100 -14 200 0 t200 0 t200 0 t200 0 t200 0 t200 0 t200 0 t200 0"/>
  </g>
  <!-- círculo holográfico no chão d'água -->
  <g fill="none" filter="url(#glow)" opacity=".8">
    <ellipse cx="800" cy="900" rx="520" ry="70" stroke="#3ff3ff" stroke-width="4"/>
    <ellipse cx="800" cy="900" rx="380" ry="50" stroke="#9ffcff" stroke-width="2" stroke-dasharray="40 16"/>
    <ellipse cx="800" cy="900" rx="220" ry="28" stroke="#3ff3ff" stroke-width="6" stroke-opacity=".6"/>
  </g>

  <!-- colinas e flores -->
  <path d="M-20 1000 V900 C 120 840, 300 820, 470 870 C 560 900, 600 940, 640 1000z" fill="url(#grama)"/>
  <path d="M1000 1000 C 1060 920, 1220 860, 1380 870 C 1500 878, 1580 900, 1620 920 V1000z" fill="url(#grama)"/>
  <path d="M-20 900 C 120 842, 300 822, 470 870" stroke="#e6ffb0" stroke-width="3" fill="none" opacity=".8"/>
  <path d="M1000 1000 C 1060 920, 1220 860, 1380 870 C 1500 878, 1580 900, 1620 920" stroke="#e6ffb0" stroke-width="3" fill="none" opacity=".8"/>
  <g>
    <use href="#flor" x="80" y="905"/><use href="#flor" x="140" y="890"/><use href="#flor" x="230" y="880"/><use href="#flor" x="320" y="882"/>
    <use href="#flor" x="400" y="898"/><use href="#flor" x="190" y="935"/><use href="#flor" x="300" y="930"/><use href="#flor" x="470" y="935"/>
    <use href="#flor" x="1120" y="915"/><use href="#flor" x="1210" y="892"/><use href="#flor" x="1300" y="884"/><use href="#flor" x="1400" y="886"/>
    <use href="#flor" x="1490" y="896"/><use href="#flor" x="1560" y="912"/><use href="#flor" x="1260" y="935"/><use href="#flor" x="1450" y="938"/>
  </g>
  <!-- reflexo especular geral -->
  <rect width="1600" height="300" fill="url(#brilho)" opacity=".18"/>
</svg>
