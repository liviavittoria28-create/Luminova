<!doctype html>
<html lang="pt-BR">
  <head>
    <script src="luminova-theme.js?v=3.1.0"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#8fd3ff" />
    <title>Explorar — LumiNova</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=3.1.0" />
    <link rel="stylesheet" href="luminova-pages.css?v=3.1.0" />
      <link rel="stylesheet" href="luminova-aero.css?v=3.1.0" />
      <link rel="stylesheet" href="luminova-3.css?v=3.1.0" />
    <link rel="stylesheet" href="luminova-aero-max.css?v=3.1.0" />
  </head>
  <body class="ln-page">
    <div class="sky" aria-hidden="true"><div class="haze haze--north"></div><div class="haze haze--south"></div><div class="belt"></div><div class="stars stars--far"></div><div class="stars stars--near"></div><div class="vignette"></div></div>
        <div class="ln-layout">
      <main class="ln-content" id="main">
        <header class="ln-top"><div class="ln-crumb">LumiNova <span> / </span> Explorar</div></header>
        <section class="ln-hero" style="padding-top:8px">
          <span class="ln-kicker">PESQUISA</span>
          <h1 class="ln-title" style="font-size:clamp(28px,5vw,44px)">Encontre pessoas,<br />espaços e conversas.</h1>
        </section>
        <form class="x-search" id="xForm" role="search">
          <span aria-hidden="true">⌕</span>
          <input id="xQuery" type="search" placeholder="Pesquisar em toda a LumiNova…" autocomplete="off" aria-label="Pesquisar" enterkeyhint="search">
        </form>
        <div class="x-filters" role="group" aria-label="Filtrar resultados">
          <button class="ln-chip active" data-kind="all" aria-pressed="true">Tudo</button>
          <button class="ln-chip" data-kind="profiles" aria-pressed="false">Perfis</button>
          <button class="ln-chip" data-kind="communities" aria-pressed="false">Comunidades</button>
          <button class="ln-chip" data-kind="posts" aria-pressed="false">Publicações</button>
        </div>
        <p class="ln-muted" id="xStatus" role="status" style="margin:14px 0"></p>
        <div id="xResults"></div>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
    <script src="supabase-config.js?v=3.1.0"></script>
    <script src="luminova-sidebar.js?v=3.1.0" defer></script>
    <script src="explorar.js?v=3.1.0" defer></script>
  </body>
</html>
